spring.application.name=TutorialClase

spring.datasource.url=jdbc:mysql://localhost:8889/jugadoresfutbol?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 1. Estrategia DDL de Hibernate: crea el esquema limpio al arrancar y lo destruye al apagar
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Forzar a Spring Boot a ejecutar los scripts SQL (schema.sql / data.sql) siempre
spring.sql.init.mode=always

# 3. CRÍTICO: Esperar a que Hibernate cree las tablas antes de lanzar data.sql
spring.jpa.defer-datasource-initialization=true

# 4. Ruta explícita del script de datos
spring.sql.init.data-locations=classpath:data.sql